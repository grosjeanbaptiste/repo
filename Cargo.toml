[package]
name = "repo"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Manage git repositories: names from actname, scaffolding and status from dotfiles, PRs through actautoma"

[dependencies]
actname = { git = "ssh://git@github.com/grosjeanbaptiste/Actname.git", rev = "001768ae0b3ee3e68a5c4f6266186eb0bb922e98" }
actit = { git = "ssh://git@github.com/grosjeanbaptiste/Actit.git", rev = "258a258b85dacb83317d8515605f4b77a754e9b2" }
actautoma = { git = "https://github.com/grosjeanbaptiste/actautoma", rev = "d0abc17fb5eab4f4e7af60ac405043b5a2180aa9" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[dev-dependencies]
tempfile = "3"
