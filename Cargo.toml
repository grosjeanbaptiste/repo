[package]
name = "repo"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Manage git repositories: names from actname, scaffolding and status from dotfiles, PRs from gh"

[dependencies]
actname = { git = "ssh://git@github.com/grosjeanbaptiste/Actname.git", rev = "001768ae0b3ee3e68a5c4f6266186eb0bb922e98" }
actit = { git = "ssh://git@github.com/grosjeanbaptiste/Actit.git", rev = "9b2af7784546480604ff804a13906e61415be460" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[dev-dependencies]
tempfile = "3"
