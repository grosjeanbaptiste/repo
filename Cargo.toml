[package]
name = "repo"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Manage git repositories: names from actname, scaffolding and status from dotfiles, PRs through actautoma"

[dependencies]
actname = { git = "ssh://git@github.com/grosjeanbaptiste/Actname.git", rev = "001768ae0b3ee3e68a5c4f6266186eb0bb922e98" }
actit = { git = "ssh://git@github.com/grosjeanbaptiste/Actit.git", rev = "f92cfecb74a430d9972e1e58f8884347edcf47d4" }
actautoma = { git = "https://github.com/grosjeanbaptiste/actautoma", rev = "c0af5152c6f1aa8cedc32ba44bfad7b27cdde4da" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[dev-dependencies]
tempfile = "3"
